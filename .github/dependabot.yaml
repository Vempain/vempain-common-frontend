version: 2

# The package consumes @vempain/vempain-auth-frontend from GitHub Packages; Dependabot resolves it through the organisation
# level VEMPAIN_ACTION_USER / VEMPAIN_ACTION_TOKEN secrets.
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    username: ${{ secrets.VEMPAIN_ACTION_USER }}
    password: ${{ secrets.VEMPAIN_ACTION_TOKEN }}

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: [ minor, patch, major ]

  - package-ecosystem: "npm"
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    groups:
      weekly-dependencies:
        applies-to: version-updates
        patterns: [ "*" ]
        update-types: [ minor, patch, major ]
      security-dependencies:
        applies-to: security-updates
        patterns: [ "*" ]
